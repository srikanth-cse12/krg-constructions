# ===================================================================
# KRG CONSTRUCTIONS - BASE CONFIGURATION
# ===================================================================
spring.application.name=krg-constructions

# Default active profile (Can be overridden via SPRING_PROFILES_ACTIVE=prod or dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server network binding - Configurable via PORT & SERVER_ADDRESS environment variables
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Application Base URL (Canonical URL, e.g. https://krgconstructions.com)
app.base-url=${APP_BASE_URL:}

# Factory & Hero Images (Overridable via environment variables)
app.hero.image=${APP_HERO_IMAGE:/images/hero-cement-brick-machine.jpg}
app.about.image=${APP_ABOUT_IMAGE:/images/solid-cement-bricks-cured.jpg}

# Performance: HTTP Response Compression (Mobile network optimization)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Security & Encoding: Enforce UTF-8 on all responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Production Health Check & Monitoring (Spring Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
