# ===================================================================
# KRG CONSTRUCTIONS - DEVELOPMENT PROFILE CONFIGURATION
# ===================================================================

# Thymeleaf caching disabled for instant template reloading
spring.thymeleaf.cache=false

# Static resources: no caching in dev
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Logging: verbose logging for debugging
logging.level.root=INFO
logging.level.com.krg.construction=DEBUG
logging.level.org.springframework.web=DEBUG

# Error page detail in development
server.error.include-message=always
server.error.include-stacktrace=always
server.error.whitelabel.enabled=true

