# ===================================================================
# KRG CONSTRUCTIONS - PRODUCTION PROFILE CONFIGURATION
# ===================================================================

# Thymeleaf template caching enabled for peak performance
spring.thymeleaf.cache=true

# Static resource caching (1 day) with compression
spring.web.resources.cache.period=86400
spring.web.resources.chain.cache=true
spring.web.resources.chain.compressed=true

# Production Logging: High performance, no sensitive data leakage
logging.level.root=INFO
logging.level.com.krg.construction=INFO
logging.level.org.springframework.web=WARN
logging.level.org.thymeleaf=WARN

# Security: Never expose stacktraces or internal messages in production error pages
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

